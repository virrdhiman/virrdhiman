name: Latest blog posts

on:
  schedule:
    # Daily at 01:30 UTC (07:00 IST)
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in virender.in posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://virender.in/blog/feed.xml"
          max_post_count: 5
          commit_message: "Update README with latest blog posts"
          committer_username: "Virender Dhiman"
          committer_email: "virrdhiman@gmail.com"
